# ==============================================================================
# AlleleFlux Visualization Workflow Configuration — REVISION, 5 mice excluded
# ==============================================================================
# Based on the latest template:
#   AlleleFlux-dev/alleleflux/smk_workflow/visualization/visualization_config.yaml
# Deviations from the template (and why):
#   * run_name / output_dir      — new tree so the July 2026 run is untouched
#   * hackflex metadata path     — filtered sheet WITHOUT mice 534/538/539/540/541
#                                  (made by make_filtered_hackflex_metadata.py;
#                                  the 5 mice are Hackflex-only, so the TruSeq
#                                  sheet and the anchor step stay identical)
#   * specific_mags              — SLG443 bin.96, the Fig 2C MAG
#   * n_sites_per_site: 0        — matches the July run's logged command
#   * output_format: pdf         — matches the July run
#   * combined_per_replicate     — on, as in the July per-replicate run
#   * bin_width_days as a LIST   — the workflow (AlleleFlux multi-width support,
#                                  added 2026-08-19) runs one plotting pass per
#                                  width and tags each file _bin<W>d, so all five
#                                  requested widths come out of the single run.

# --- General Settings ---
run_name: "visualization_SLG443_bin96_excl5mice"

# Base directory for all output files generated by the workflow
output_dir: "/scratch/gpfs/AMOELLER/sidd/diet_manip/revision_July_2026/AlleleFlux_revision/plotting_SLG443_bin96_excl5mice"

# Resource allocation
resources:
  threads_per_job: 16
  mem_per_job: "150G"            # Memory per job. Formats: "8G", "100G", "102400M"

# Only the Fig 2C MAG is tracked and plotted
specific_mags: ["SLG443_DASTool_bins_SLG443_bin.96"]

# ==============================================================================
# Step 1: Metadata Preparation
# ==============================================================================
metadata_params:
  - name: "longitudinal"
    path: "/scratch/gpfs/AMOELLER/diet_manip/copy_sg4230_scratch/sg4230/popgentoolkit/metadata_md_bam.tsv"
    base_profile_dir: "/scratch/gpfs/AMOELLER/diet_manip/AlleleFlux_mapq20/longitudinal/profiles"

  - name: "hackflex"
    # FILTERED sheet — mice 534/538/539/540/541 removed at the source.
    # Lives inside output_dir (user preference); if the output tree is wiped
    # for a clean rerun, re-run make_filtered_hackflex_metadata.py first.
    path: "/scratch/gpfs/AMOELLER/sidd/diet_manip/revision_July_2026/AlleleFlux_revision/plotting_SLG443_bin96_excl5mice/hackflex_metadata_final.excl534_538-541.tsv"
    base_profile_dir: "/scratch/gpfs/AMOELLER/diet_manip/AlleleFlux_mapq20_hackflex/single_timepoint/profiles"

# ==============================================================================
# Step 2: Terminal Nucleotide Analysis
# ==============================================================================
# Uses the TruSeq/longitudinal metadata only — the excluded mice have no rows
# there, so anchors are identical to the published/July runs by construction.
significant_sites_file: "/scratch/gpfs/AMOELLER/diet_manip/AlleleFlux_mapq20/longitudinal/p_value_summary/pre_end-fat_control/p_value_summary_two_sample_paired_pre_end.tsv"
profile_dir: "/scratch/gpfs/AMOELLER/diet_manip/AlleleFlux_mapq20/longitudinal/profiles"
metadata: "/scratch/gpfs/AMOELLER/diet_manip/copy_sg4230_scratch/sg4230/popgentoolkit/metadata_md_bam.tsv"

analysis_params:
  group: "fat"              # The group to analyze (e.g., treatment group)
  timepoint: "end"          # The timepoint representing the terminal state
  p_value_column: "q_value" # Column to use for significance filtering
  p_value_threshold: 0.05   # Threshold for significance
  test_type: "two_sample_paired_tTest" # Statistical test used to generate p-values
  initial_timepoint: "pre"  # Enables terminal-nucleotide-by-frequency-change

# ==============================================================================
# Step 3: Allele Frequency Tracking
# ==============================================================================
tracking_params:
  anchor_column: "terminal_nucleotide_freq_change"
  min_cov_per_site: 3

# ==============================================================================
# Step 4: Plotting
# ==============================================================================
plotting_params:
  value_col: "min_p_value"   # Column used to rank sites
  n_sites_line: 2000         # Number of top sites for combined line plots
  n_sites_per_site: 0        # 0 = no per-site plots (matches July run)
  x_col: "day"               # X-axis column ('time' or 'day')
  x_order: []                # Optional: Explicit order for x-axis
  plot_types: ["line"]       # List of plot types to generate
  per_site: True             # Flag present in July run; n_sites_per_site 0 disables output
  output_format: "pdf"       # Output format (png, pdf, svg)

  # Advanced plotting options
  bin_width_days: [10, 20, 30, 40, 50]  # one plotting pass per width; files tagged _bin<W>d
  min_samples_per_bin: 2     # Minimum valid samples required per bin
  group_by_replicate: True   # Group by replicate in per-site plots
  combined_per_replicate: True # One combined line plot per replicate (by_replicate/)
  line_alpha: 0.1            # Line transparency (0-1)

  # Initial frequency filtering
  max_initial_freq: 0.5      # Keep sites where initial freq <= this value
  initial_freq_group: "both" # Require criteria in ALL groups
